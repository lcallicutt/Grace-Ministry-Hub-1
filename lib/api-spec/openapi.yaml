openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: pilot
    description: Private pilot access
  - name: dashboard
    description: Ministry workspace overview
  - name: profile
    description: Church profile operations
  - name: conversations
    description: Grace conversations and assistant messages
  - name: services
    description: Weekly service builder operations
  - name: volunteers
    description: Volunteer roster operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pilot/status:
    get:
      operationId: getPilotAccessStatus
      tags: [pilot]
      summary: Check pilot access
      responses:
        "200":
          description: Current pilot access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotAccessStatus"
  /pilot/login:
    post:
      operationId: startPilotAccess
      tags: [pilot]
      summary: Unlock the private pilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotAccessCredentials"
      responses:
        "200":
          description: Pilot access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotAccessStatus"
        "401":
          description: Invalid pilot password
        "429":
          description: Too many login attempts
  /pilot/logout:
    post:
      operationId: endPilotAccess
      tags: [pilot]
      summary: End the current pilot session
      responses:
        "200":
          description: Pilot session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotAccessStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the ministry workspace overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /church-profile:
    get:
      operationId: getChurchProfile
      tags: [profile]
      summary: Get the church profile
      responses:
        "200":
          description: Church profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchProfile"
    patch:
      operationId: updateChurchProfile
      tags: [profile]
      summary: Update the church profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChurchProfileUpdate"
      responses:
        "200":
          description: Updated church profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchProfile"
  /volunteers:
    get:
      operationId: getVolunteers
      tags: [volunteers]
      summary: List volunteers in the current church
      responses:
        "200":
          description: Volunteer roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volunteer"
    post:
      operationId: createVolunteer
      tags: [volunteers]
      summary: Add a volunteer to the current church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerInput"
      responses:
        "201":
          description: Created volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"
  /volunteers/import:
    post:
      operationId: importVolunteers
      tags: [volunteers]
      summary: Import volunteers into the current church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerImportInput"
      responses:
        "201":
          description: Imported volunteers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerImportResult"
  /volunteers/{volunteerId}:
    get:
      operationId: getVolunteer
      tags: [volunteers]
      summary: Get volunteer details in the current church
      parameters:
        - $ref: "#/components/parameters/VolunteerId"
      responses:
        "200":
          description: Volunteer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerDetail"
        "404":
          description: Volunteer not found
    patch:
      operationId: updateVolunteer
      tags: [volunteers]
      summary: Update a volunteer in the current church
      parameters:
        - $ref: "#/components/parameters/VolunteerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerUpdate"
      responses:
        "200":
          description: Updated volunteer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"
        "404":
          description: Volunteer not found
  /conversations:
    get:
      operationId: getConversations
      tags: [conversations]
      summary: List recent conversations
      responses:
        "200":
          description: Recent conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation with its messages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Conversation not found
    post:
      operationId: sendConversationMessage
      tags: [conversations]
      summary: Send a message to Grace
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: User and assistant messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePair"
        "404":
          description: Conversation not found
  /service-plans:
    get:
      operationId: getServicePlans
      tags: [services]
      summary: List saved weekly service plans
      responses:
        "200":
          description: Saved service plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicePlan"
    post:
      operationId: createServicePlan
      tags: [services]
      summary: Create a weekly service plan and its outputs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePlanInput"
      responses:
        "201":
          description: Created service plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlanDetail"
  /service-plans/{servicePlanId}:
    get:
      operationId: getServicePlan
      tags: [services]
      summary: Get a weekly service plan and generated outputs
      parameters:
        - $ref: "#/components/parameters/ServicePlanId"
      responses:
        "200":
          description: Service plan detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlanDetail"
        "404":
          description: Service plan not found
components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
    ServicePlanId:
      name: servicePlanId
      in: path
      required: true
      schema:
        type: integer
    VolunteerId:
      name: volunteerId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    PilotAccessStatus:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
    PilotAccessCredentials:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [church, conversationCount, servicePlanCount, nextService, recentConversations]
      properties:
        church:
          type: string
        conversationCount:
          type: integer
        servicePlanCount:
          type: integer
        nextService:
          type: ["string", "null"]
        recentConversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
    ChurchProfile:
      type: object
      required: [id, churchName, pastorName, address, serviceTime, welcomeNote, updatedAt]
      properties:
        id:
          type: integer
        churchName:
          type: string
        pastorName:
          type: string
        address:
          type: string
        serviceTime:
          type: string
        welcomeNote:
          type: string
        updatedAt:
          type: string
    ChurchProfileUpdate:
      type: object
      properties:
        churchName:
          type: string
        pastorName:
          type: string
        address:
          type: string
        serviceTime:
          type: string
        welcomeNote:
          type: string
    Volunteer:
      type: object
      required: [id, firstName, lastName, email, phone, team, status, isStudent, schoolName, guardianName, guardianPhone, guardianEmail, notes, createdAt, updatedAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        team:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        isStudent:
          type: boolean
        schoolName:
          type: ["string", "null"]
        guardianName:
          type: ["string", "null"]
        guardianPhone:
          type: ["string", "null"]
        guardianEmail:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
    VolunteerInput:
      type: object
      required: [firstName, lastName, status, isStudent]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        team:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        isStudent:
          type: boolean
        schoolName:
          type: ["string", "null"]
        guardianName:
          type: ["string", "null"]
        guardianPhone:
          type: ["string", "null"]
        guardianEmail:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
    VolunteerUpdate:
      $ref: "#/components/schemas/VolunteerInput"
    VolunteerDetail:
      allOf:
        - $ref: "#/components/schemas/Volunteer"
        - type: object
          required: [upcomingSignups, totalApprovedHours]
          properties:
            upcomingSignups:
              type: array
              items:
                $ref: "#/components/schemas/VolunteerUpcomingSignup"
            totalApprovedHours:
              type: number
    VolunteerUpcomingSignup:
      type: object
      required: [id, slotTitle, date, startTime, status]
      properties:
        id:
          type: integer
        slotTitle:
          type: string
        date:
          type: string
        startTime:
          type: string
        status:
          type: string
          enum: [confirmed, waitlisted, cancelled, no_show]
    VolunteerImportRow:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        team:
          type: ["string", "null"]
    VolunteerImportInput:
      type: object
      required: [volunteers]
      properties:
        volunteers:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/VolunteerImportRow"
    VolunteerImportResult:
      type: object
      required: [imported]
      properties:
        imported:
          type: integer
    Conversation:
      type: object
      required: [id, title, preview, category, createdAt, updatedAt, messageCount]
      properties:
        id:
          type: integer
        title:
          type: string
        preview:
          type: string
        category:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        messageCount:
          type: integer
    ConversationInput:
      type: object
      required: [title, category]
      properties:
        title:
          type: string
          minLength: 1
        category:
          type: string
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
    Message:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
    MessagePair:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: "#/components/schemas/Message"
        assistantMessage:
          $ref: "#/components/schemas/Message"
    ServicePlan:
      type: object
      required: [id, churchName, serviceDate, serviceTime, sermonTitle, speaker, createdAt]
      properties:
        id:
          type: integer
        churchName:
          type: string
        serviceDate:
          type: string
        serviceTime:
          type: string
        sermonTitle:
          type: string
        speaker:
          type: ["string", "null"]
        createdAt:
          type: string
    ServicePlanInput:
      type: object
      required: [churchName, serviceDate, serviceTime, sermonTitle]
      properties:
        churchName:
          type: string
        serviceDate:
          type: string
        serviceTime:
          type: string
        sermonTitle:
          type: string
        speaker:
          type: ["string", "null"]
        orderOfService:
          type: ["string", "null"]
        announcements:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
    ServicePlanDetail:
      allOf:
        - $ref: "#/components/schemas/ServicePlan"
        - $ref: "#/components/schemas/ServiceOutputs"
    ServiceOutputs:
      type: object
      required: [bulletin, projection, announcerSheet]
      properties:
        bulletin:
          type: string
        projection:
          type: string
        announcerSheet:
          type: string

